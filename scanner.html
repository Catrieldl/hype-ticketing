<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escáner - Hype Venue</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #000; color: #fff; margin: 0; padding: 20px; text-align: center; }
        h2 { color: #00ffcc; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }
        
        /* Control estricto del tamaño del lector */
        #reader { width: 100%; max-width: 350px; margin: 0 auto; border: 2px solid #333; border-radius: 8px; background: #111; overflow: hidden; }
        #reader button { background: #00ffcc; color: #000; border: none; padding: 10px; border-radius: 4px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        
        #resultado { margin-top: 20px; padding: 20px; border-radius: 8px; font-size: 18px; font-weight: bold; display: none; max-width: 310px; margin: 20px auto 0 auto; }
        .estado-ok { background: #00ffcc; color: #000; }
        .estado-error { background: #ff4444; color: #fff; }
        .estado-usado { background: #ffaa00; color: #000; }
        
        .btn-reiniciar { background: #333; color: #fff; border: 1px solid #555; padding: 15px; border-radius: 6px; margin-top: 15px; cursor: pointer; font-weight: bold; width: 100%; max-width: 350px; display: none; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>
    <h2>Control de Puerta</h2>
    <div id="reader"></div>
    <div id="resultado"></div>
    <button id="btnReiniciar" class="btn-reiniciar" onclick="reiniciarScanner()">Escanear otro ticket</button>

    <script>
        const API_URL = '/api';
        let html5QrcodeScanner;
        
        function onScanSuccess(decodedText, decodedResult) {
            html5QrcodeScanner.clear(); 
            document.getElementById('reader').style.display = 'none';
            procesarTicket(decodedText.split('/').pop()); // Extrae el UUID si leen el link completo
        }

        async function procesarTicket(codigo) {
            const resDiv = document.getElementById('resultado');
            const btn = document.getElementById('btnReiniciar');
            resDiv.style.display = 'block';
            resDiv.className = '';
            resDiv.innerText = 'Verificando...';

            try {
                let res = await fetch(`${API_URL}/escanear/${codigo}`);
                let data = await res.json();

                if (!res.ok) {
                    resDiv.classList.add('estado-error');
                    resDiv.innerText = `❌ ${data.error || 'Ticket no válido'}`;
                } else if (data.estado === 'Usado') {
                    resDiv.classList.add('estado-usado');
                    resDiv.innerHTML = `⚠️ TICKET YA USADO<br><small>Sector: ${data.sector}</small>`;
                } else if (data.estado === 'Pendiente') {
                    resDiv.classList.add('estado-error');
                    resDiv.innerHTML = `❌ TICKET NO PAGADO<br><small>Aún figura como pendiente</small>`;
                } else if (data.estado === 'Pagado') {
                    let resUsar = await fetch(`${API_URL}/escanear/${codigo}/usar`, { method: 'POST' });
                    let dataUsar = await resUsar.json();
                    
                    if (resUsar.ok) {
                        resDiv.classList.add('estado-ok');
                        resDiv.innerHTML = `✅ ACCESO PERMITIDO<br><strong style="font-size:24px;">${data.sector}</strong>`;
                    } else {
                        resDiv.classList.add('estado-error');
                        resDiv.innerText = `❌ Error al procesar: ${dataUsar.error}`;
                    }
                }
            } catch (err) {
                resDiv.classList.add('estado-error');
                resDiv.innerText = "❌ Error de conexión con el servidor.";
            }
            btn.style.display = 'block';
        }

        function reiniciarScanner() {
            document.getElementById('resultado').style.display = 'none';
            document.getElementById('btnReiniciar').style.display = 'none';
            document.getElementById('reader').style.display = 'block';
            iniciarScanner();
        }

        function iniciarScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 250} }, false);
            html5QrcodeScanner.render(onScanSuccess);
        }

        window.onload = iniciarScanner;
    </script>
</body>
</html>
